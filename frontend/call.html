<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leroy | Private call room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="call.css" />
</head>
<body>
  <main class="call-shell">
    <header><a class="brand" href="/"><span class="brand-mark">L</span>Leroy</a><span class="secure-badge">● Private room</span></header>
    <section class="call-heading"><div><p class="eyebrow">SELF TEST ROOM</p><h1>Connect with yourself.</h1><p>Open this same link on another tab or device to test your audio and video.</p></div><button class="invite-button" id="email-invite">✉ Email link to myself</button></section>
    <section class="video-grid">
      <article class="video-card remote-card"><video id="remote-video" autoplay playsinline></video><div class="video-placeholder" id="remote-placeholder"><span class="placeholder-icon">◌</span><strong>Waiting for the other you</strong><small>Open this link in a second tab or device</small></div><span class="video-label">Other participant</span></article>
      <article class="video-card local-card"><video id="local-video" autoplay muted playsinline></video><div class="video-placeholder local-placeholder" id="local-placeholder"><span class="placeholder-icon">◉</span><strong>Camera preview</strong><small>Allow camera and microphone access</small></div><span class="video-label">You</span></article>
    </section>
    <section class="call-controls"><div class="connection-copy"><span class="connection-dot" id="connection-dot"></span><span id="connection-status">Starting camera…</span></div><div class="controls"><button id="mute-button">🎙 Mute</button><button id="camera-button">▣ Camera</button><button class="end-button" id="end-button">End call</button></div><button class="copy-button" id="copy-link">↗ Copy invite link</button></section>
    <p class="call-message" id="call-message" role="status"></p>
  </main>
  <script src="call.js"></script>
</body>
</html>
